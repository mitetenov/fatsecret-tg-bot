services:
  bot:
    image: mitetenov/fsbot:latest
    # Тег latest не меняется, поэтому без этого `docker compose up -d` поднимает
    # закешированный образ и в реестр не ходит — сервер молча остаётся на старом коде.
    pull_policy: always
    restart: unless-stopped
    env_file: [.env]
    # Именованный том, а не ./data: bind-mount на чистом сервере создаётся от root,
    # а процесс работает под uid 10001 — sqlite падал с «unable to open database file».
    # Том наследует владельца из образа, где /data уже принадлежит fsbot.
    volumes:
      - fsbot-data:/data
    healthcheck:
      test: ["CMD-SHELL", "find /data/heartbeat -mmin -2 | grep -q heartbeat"]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 30s

volumes:
  fsbot-data:
