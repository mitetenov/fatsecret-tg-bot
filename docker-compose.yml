services:
  bot:
    image: mitetenov/fsbot:latest
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "find /data/heartbeat -mmin -2 | grep -q heartbeat"]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 30s
