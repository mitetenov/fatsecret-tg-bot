# Всё запускается через compose; локальный venv нужен только если хочется без Docker.
#
#   docker compose run --rm test              — тесты
#   docker compose run --rm spike             — спайк FatSecret (PIN вводится в терминале)
#   docker compose up bot                     — сам бот
#
# Состояние (SQLite, кеш токена спайка) лежит в ./data и переживает пересборку.

x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  image: fsbot:dev
  env_file: [.env]
  volumes:
    - ./data:/data

services:
  bot:
    <<: *common
    restart: unless-stopped

  test:
    <<: *common
    # Тесты не должны видеть ключи: они на чистой логике, сеть им не нужна.
    env_file: []
    network_mode: none
    command: ["python", "-m", "pytest", "-q"]

  spike:
    <<: *common
    # Спайк спрашивает PIN — без stdin и tty он упадёт на input().
    stdin_open: true
    tty: true
    command: ["python", "spike/check_fatsecret.py"]
