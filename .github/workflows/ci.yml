name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/fsbot

jobs:
  test:
    name: Go, race detector и запуск образа
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Собрать образ для тестов
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          platforms: linux/amd64
          load: true
          tags: fsbot:test
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test
      - name: Форматирование, vet, тесты и детектор гонок без внешней сети
        run: |
          docker run --rm --network none fsbot:test sh -ec '
            test -z "$(gofmt -l cmd internal)"
            go vet -mod=readonly ./...
            go test -mod=readonly -race -count=1 ./...
          '
      - name: Собрать production-образ
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: fsbot:runtime
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - name: Проверить SQLite, права тома и healthcheck
        run: sh tools/verify-image.sh fsbot:runtime

  build:
    name: Сборка и публикация amd64 + arm64
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Логин в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Собрать и запушить
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
