name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/fsbot

jobs:
  test:
    name: Go, race detector и образ ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Собрать образ для тестов
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: fsbot:test
          cache-from: type=gha,scope=test-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=test-${{ matrix.arch }}
      - name: Форматирование, vet, тесты и детектор гонок без внешней сети
        run: |
          docker run --rm --network none fsbot:test sh -ec '
            test -z "$(gofmt -l cmd internal)"
            go vet -mod=readonly ./...
            go test -mod=readonly -race -count=1 ./...
          '
      - name: Собрать production-образ
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: fsbot:runtime
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.arch }}
      - name: Проверить SQLite, права тома и healthcheck
        run: sh tools/verify-image.sh fsbot:runtime
      - name: Логин в Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Тот же BuildKit использует результат проверенной сборки без компиляции заново.
      - name: Отправить проверенный образ по digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Сохранить digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Передать digest для общего manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  build:
    name: Публикация manifest amd64 + arm64
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Логин в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Получить digests обеих архитектур
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Создать общий manifest и проверить архитектуры
        run: |
          digests=("$RUNNER_TEMP"/digests/*)
          test "${#digests[@]}" -eq 2
          images=()
          for path in "${digests[@]}"; do
            digest="${path##*/}"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            images+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:$GITHUB_SHA" \
            "${images[@]}"
          docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --raw | jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture] |
            sort == ["amd64", "arm64"]
          '
