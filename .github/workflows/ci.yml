name: CI

# PR — только тесты. Push в основную ветку — тесты, и лишь потом сборка и публикация:
# job build зависит от test, поэтому красные тесты блокируют и билд, и пуш в Docker Hub.
on:
  pull_request:
  push:
    branches: [main]

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/fsbot

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Тесты гоняем в том же образе, который поедет в прод, — иначе «у меня работало»
      # означает «работало в другом окружении».
      - name: Собрать образ для тестов
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fsbot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Без сети: тесты покрывают чистую логику, ходить наружу им незачем,
      # а запрет превращает случайный сетевой вызов в упавший тест, а не в флак.
      - name: pytest
        run: docker run --rm --network none fsbot:ci python -m pytest -q

  build:
    name: Сборка и публикация
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 собирается через эмуляцию: один образ идёт и на VPS, и на Raspberry Pi.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Логин в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Собрать и запушить
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
