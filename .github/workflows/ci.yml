name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt a main-branch publication between digest and manifest upload.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/fsbot
  DOCKER_BUILD_RECORD_RETENTION_DAYS: 3

jobs:
  test:
    needs: lint
    name: Go, race detector и образ ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Восстановить кеш компиляции Go
        id: go-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-build
          key: go-build-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('Dockerfile', 'go.mod', 'go.sum') }}-${{ hashFiles('cmd/**/*.go', 'internal/**/*.go', 'tools/ci-go.sh') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('Dockerfile', 'go.mod', 'go.sum') }}-
            go-build-${{ runner.os }}-${{ matrix.arch }}-
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
      - name: Передать кеш Go в BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          utility-image: alpine:3.24.3
          scratch-dir: ${{ runner.temp }}/cache-dance
          cache-map: |
            {"${{ runner.temp }}/go-build": {"target": "/go-build", "uid": 10001, "gid": 10001}}
          skip-extraction: ${{ steps.go-cache.outputs.cache-hit }}
      - name: Форматирование, vet, гонки и сборка без сети в BuildKit
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ci-artifacts
          platforms: linux/${{ matrix.arch }}
          outputs: type=local,dest=.ci-bin
          build-args: |
            VERSION=${{ github.sha }}
            CI_TEST_RUN=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=test-${{ matrix.arch }}
          # An exact Go key includes the SDK/dependencies and Go sources. Keep
          # reading these layers without re-uploading the large SDK on every run.
          # CI_TEST_RUN still forces all tests to execute.
          cache-to: ${{ steps.go-cache.outputs.cache-hit != 'true' && format('type=gha,mode=max,scope=test-{0}', matrix.arch) || '' }}
      - name: Упаковать проверенный бинарник в production-образ
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ci-runtime
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: fsbot:runtime
          cache-from: type=gha,scope=runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.arch }}
      - name: Логин в Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Тот же BuildKit использует результат проверенной сборки без компиляции заново.
      - name: Отправить проверенный образ по digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ci-runtime
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Сохранить digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Передать digest для общего manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  build:
    name: Публикация manifest amd64 + arm64
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # imagetools only talks to the registry; it does not need a BuildKit container.
          driver: docker
      - name: Логин в Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Получить digests обеих архитектур
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Создать общий manifest и проверить архитектуры
        run: |
          digests=("$RUNNER_TEMP"/digests/*)
          test "${#digests[@]}" -eq 2
          images=()
          for path in "${digests[@]}"; do
            digest="${path##*/}"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            images+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create \
            --tag "$IMAGE:$GITHUB_SHA" \
            "${images[@]}"
          docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --raw | jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture] |
            sort == ["amd64", "arm64"]
          '
          # Promote only the manifest whose architecture set was verified above.
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$GITHUB_SHA"

  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Module consistency
        env:
          GOTOOLCHAIN: local
        run: |
          go mod tidy -diff
          go mod verify
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
