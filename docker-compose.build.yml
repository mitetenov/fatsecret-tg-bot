# Локальная сборка того же образа — для разработки, пока изменения не в main.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d bot
#
# Тег совпадает с тем, что тянет основной файл, поэтому собранный образ подменяет
# скачанный. pull_policy сбрасывается в never, иначе compose уйдёт за latest в реестр
# и затрёт локальную сборку.

x-build: &build
  build:
    context: .
    dockerfile: Dockerfile
  image: ${FSBOT_IMAGE:-mitetenov/fsbot:latest}
  pull_policy: never

services:
  bot:
    <<: *build
  test:
    <<: *build
  spike:
    <<: *build
