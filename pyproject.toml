[project]
name = "fsbot"
version = "0.1.0"
description = "Telegram-бот для добавления еды в личный аккаунт FatSecret"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.27",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    # Штрих-код читается локально: точнее, быстрее и бесплатнее, чем vision-моделью.
    "pyzbar>=0.1.9",
    "pillow>=11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
